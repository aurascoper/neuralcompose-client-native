name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the toolchain; install THAT one with the
      # components, or cargo delegates to a bare auto-installed 1.97.1
      # without rustfmt/clippy.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test (no FFI)
        run: cargo test
      - name: Test (uniffi feature)
        run: cargo test --features uniffi
      - name: Fixture drift check
        run: ./scripts/check-fixtures.sh
