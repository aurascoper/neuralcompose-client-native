name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the toolchain; install THAT one with the
      # components, or cargo delegates to a bare auto-installed 1.97.1
      # without rustfmt/clippy.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test (no FFI)
        run: cargo test
      - name: Test (uniffi feature)
        run: cargo test --features uniffi
      - name: Fixture drift check
        run: ./scripts/check-fixtures.sh
      - name: Generated-binding drift
        run: ./scripts/check-binding-drift.sh
      - name: Secret / private-endpoint scan
        run: ./scripts/check-no-secrets.sh
      - name: Whitespace and conflict markers
        run: git diff --check HEAD

  # Compiles and RUNS the UniFFI Kotlin bindings against the real cdylib on a
  # host JVM — `android/core` is explicitly "a host-JVM harness … without any
  # Android SDK". Unlike the Swift job below this executes code: JNA dlopens
  # `target/debug/libneuralcompose_mobile_core.so` and the assertions cross the
  # FFI boundary for real.
  #
  # NOT ANDROID EVIDENCE. The `android/arm64` rows are `Contracted`, and a
  # linux/x86_64 JVM run cannot promote them — different OS, different
  # architecture, no device. What it does prove is that the generated Kotlin
  # compiles and that its assertions agree with the Rust they wrap, which until
  # 2026-08-03 had never been checked on any machine.
  #
  # Blocking, unlike the Swift job, because it is deterministic and exercises
  # real behaviour rather than syntax. If Maven Central flakiness makes it
  # unreliable, demote it to continue-on-error rather than deleting it.
  kotlin-bindings-jvm:
    name: kotlin-bindings (host jvm, linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Matches jvmToolchain(21) in android/core/build.gradle.kts. A
          # mismatch makes Gradle try to provision its own toolchain and fail
          # on a runner with no network access to a JDK vendor.
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # The harness dlopens this via jna.library.path; without it every test
      # errors at class-load with UnsatisfiedLinkError rather than failing an
      # assertion, which is the M5 lesson the drift guard already records.
      - name: Build host cdylib
        run: cargo build --features uniffi -p neuralcompose-mobile-core
      - name: Kotlin binding tests
        working-directory: android/core
        run: gradle test --no-daemon --console=plain
      # A `test` task with zero tests also reports BUILD SUCCESSFUL, so the
      # count is asserted rather than the exit code trusted.
      - name: Assert tests actually ran
        working-directory: android/core
        run: |
          set -eu
          python3 - <<'EOF'
          import glob, sys, xml.etree.ElementTree as ET
          files = glob.glob('build/test-results/test/*.xml')
          if not files:
              sys.exit('no test result XML — the test task ran nothing')
          total = sum(int(ET.parse(f).getroot().get('tests', 0)) for f in files)
          print(f'kotlin binding tests executed: {total}')
          if total < 7:
              sys.exit(f'expected at least 7 tests, saw {total}')
          EOF

  # SYNTAX ONLY. NOT iOS EVIDENCE. NOT A SUPPORT-MATRIX INPUT.
  #
  # Parses the UniFFI-generated Swift on Linux to catch a broken regeneration in
  # seconds instead of waiting for a Mac. A green run here says the GENERATED
  # BINDINGS ARE SYNTACTICALLY VALID SWIFT, and nothing else.
  #
  # PARSE, NOT TYPE-CHECK, and the distinction is forced rather than chosen.
  # The generated Swift imports a companion C module (neuralcompose_mobile_coreFFI)
  # that uniffi emits as an untracked .h + .modulemap, and that modulemap
  # declares `use "Darwin"`. On Linux the module is absent, the
  # `#if canImport(...)` guard skips the import, and every FFI type
  # (RustBuffer, ForeignBytes, ...) is undefined — a first attempt at
  # -typecheck failed with exactly that. Supplying the module would mean
  # building the Rust cdylib inside this container, which is a second full
  # build and not a fast fail.
  #
  # It says nothing about ios/arm64. Those rows are `Contracted`, and evidence
  # produced on Linux can never promote them — reading a green job here as iOS
  # readiness is exactly the promotion-by-implication ADR-002 exists to forbid,
  # and the same shape as a canary labelled `ubuntu-26.04-preview` that was
  # really running 24.04.
  #
  # It also does NOT build: the SwiftUI shell (no UIKit/SwiftUI on Linux), the
  # XCFramework, or anything requiring Xcode. `ios/NeuralComposeCore/Tests`
  # uses XCTest and is not compiled here.
  #
  # Non-blocking on purpose. A Linux Swift toolchain regression must never gate
  # a merge for a target it cannot speak to.
  swift-bindings-syntax-linux:
    name: swift-bindings-syntax (linux, informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      # Type-check only — no binary is produced and none is wanted. The
      # generated file needs its FFI symbols at link time, which do not exist
      # without building the Rust cdylib for this container; parsing and type
      # checking is the whole claim.
      - name: Parse generated Swift bindings
        # `set -eu` without pipefail: the swift container's default shell is
        # dash, which has no pipefail, and the first run of this job died on
        # that before ever reaching swiftc — a red job that had checked
        # nothing. There are no pipes here, so pipefail bought nothing anyway.
        run: |
          set -eu
          F=ios/NeuralComposeCore/Sources/NeuralComposeCore/neuralcompose_mobile_core.swift
          test -f "$F" || { echo "generated binding missing: $F"; exit 1; }
          swiftc -parse -swift-version 5 "$F"
          echo "generated Swift bindings are syntactically valid Swift"
      - name: Restate the boundary
        run: |
          echo "PARSE ONLY — no type checking, no linking, no iOS anything."
          echo "This job is not evidence for any ios/arm64 row."
          echo "See docs/support-matrix.md; those rows remain Contracted."

  # Tier 1 skeleton (ADR-002): build authorities are required; preview
  # runners are canaries — visible and investigated, never the sole merge
  # authority until runner stability is acceptable. No model weights, no
  # provider secrets, and no hardware claims are produced here.
  build-matrix:
    name: build (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.canary }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: ubuntu-24.04-x86_64, runner: ubuntu-24.04, canary: false }
          - { label: windows-2025-x86_64, runner: windows-2025, canary: false }
          # Labels must name the runner they actually get. `ubuntu-latest`
          # tracks the newest GA image, and Ubuntu 26.04 is available only as a
          # public preview under the explicit `ubuntu-26.04` label — so the
          # 26.04 canary was running 24.04 and silently duplicating the row
          # above it. Same defect on macOS: `macos-latest` is not `macos-26`,
          # and that row is a non-canary build authority, which makes it worse.
          # A row named for an OS it has never touched is promotion by
          # implication, which ADR-002 exists to prevent.
          - { label: macos-26-arm64, runner: macos-26, canary: false }
          - { label: ubuntu-26.04-preview, runner: ubuntu-26.04, canary: true }
          - { label: windows-arm64-preview, runner: windows-11-arm, canary: true }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - name: Build core
        run: cargo build -p neuralcompose-mobile-core --all-features
      - name: Contract tests
        run: cargo test -p neuralcompose-mobile-core
