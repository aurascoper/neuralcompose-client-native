[package]
name = "neuralcompose-mobile-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Shared behavioral core for NeuralCompose clients: EEG wire validation, bounded buffering, stream staleness/reconnect state machine, config validation."

[lib]
name = "neuralcompose_mobile_core"
# staticlib -> iOS XCFramework, cdylib -> Android jniLibs + host-JVM tests + bindgen --library
crate-type = ["lib", "staticlib", "cdylib"]

[features]
default = []
# Exact-pinned: uniffi-bindgen and the runtime must come from the same version,
# or the embedded contract checksum aborts at app runtime.
uniffi = ["dep:uniffi"]

[dependencies]
semver = "1.0.28"
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: serde_json's DEFAULT parser is approximate — it writes
# the correct shortest form and reads it back up to 1 ULP low, so a persisted
# f64 does not reproduce itself. Measured 2026-08-13: 14.067217896390133 came
# back as ...131 from a channel-health line. The digest still verifies (it is
# over bytes), which is exactly why this would never have surfaced on its own.
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11.0"
uniffi = { version = "=0.32.0", features = ["cli"], optional = true }

[dev-dependencies]
proptest = "1"
jsonschema = "0.32"
tungstenite = "0.28"
ureq = "2"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["uniffi"]
