[package]
name = "neuralcompose-viz"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
neuralcompose-mobile-core = { path = "../neuralcompose-mobile-core" }
neuralcompose-hypnagogic = { path = "../neuralcompose-hypnagogic" }
eframe = { version = "=0.36.2", default-features = false, features = ["wgpu", "wayland", "x11", "default_fonts", "accesskit"] }
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.30", features = ["bytemuck"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11"
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "neuralcompose-viz"
path = "src/main.rs"
